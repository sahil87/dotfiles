# tu config — token usage multi-machine sync
#
# mode: single (default) or multi (enables cross-machine sync)
mode = multi

# Required for multi mode: git repo URL for metrics storage
# Uncomment and set before running tu init-metrics
metrics_repo = git@github.com:sahil-weaver/tu-metrics.git

# Optional: local path where the metrics repo is cloned (default: ~/.tu-metrics)
# metrics_dir = ~/.tu-metrics

# Optional: label for this machine in the metrics repo (default: system hostname)
# machine = my-macbook
