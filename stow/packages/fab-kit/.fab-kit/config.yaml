dispatch:
  mode: pane

agent:
  session: claude
  workers: kimi
  profiles:
    operator:
      provider: claude

providers:
  claude:
    profiles:
      default:
          model: claude-fable-5
          effort: high

# >>> fab reference (kit 2.23.11) >>> --------------------------------------
# ~/.fab-kit/config.yaml — system-level fab config (all repos on this machine).
# Resolves ABOVE any project's fab/project/config.yaml (and below environment
# overrides), so a preference set here beats a repo's committed suggestion. Only
# preference-class fields (scope: system/both) are honored here; a project-scoped
# field placed in this file is ignored with a warning.
#
# Overridable fields you have NOT overridden, with current defaults.
# REGENERATED by `fab config upgrade --system` on every upgrade — edits inside this
# fence are overwritten. To override a field: move it ABOVE the fence and
# uncomment it.
#
# dispatch.mode / dispatch.column_width / dispatch.reap_done — stage-dispatch
# mode (pane → native → headless, descending), the pane-worker column width
# in percent, and done-pane reaping. [both]
# Settable machine-wide: fab config set --system dispatch.mode <pane|native|headless>
#                        fab config set --system dispatch.column_width <percent>
#                        fab config set --system dispatch.reap_done <true|false>
# Full prose: fab config explain dispatch.mode
# dispatch:
#   column_width: 35
#   reap_done: true
#
# autopilot.merge_mode — standing merge-topology preference for `fab operator
# autopilot start` (cherry-pick-ladder, merge-auto, stacked-prs); an explicit --mode
# flag outranks it. [both]
# Settable machine-wide: fab config set --system autopilot.merge_mode <cherry-pick-ladder|merge-auto|stacked-prs>
# Full prose: fab config explain autopilot.merge_mode
# autopilot:
#   merge_mode: cherry-pick-ladder
# <<< end fab reference <<< ------------------------------------------------
